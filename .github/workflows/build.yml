name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abrir o projeto e baixar o MDK do Forge 1.20.1
        run: |
          unzip -q ./*.zip -d proj
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          unzip -q forge-1.20.1-47.3.0-mdk.zip -d mdk
          rm -rf mdk/src
          cp -r proj/*/src mdk/src
          sed -i 's/^mod_id=.*/mod_id=cataclismo/; s/^mod_group_id=.*/mod_group_id=com.cataclismo/' mdk/gradle.properties

      - name: Compilar
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cataclismo-mod
          path: mdk/build/libs/*.jar
